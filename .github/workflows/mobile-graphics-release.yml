name: Publish landscape-only phone gameplay
on:
  push:
    branches: [main]
    paths:
      - tools/landscape-patch.cjs
      - .github/workflows/mobile-graphics-release.yml
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: mobile-graphics-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply verified phone graphics fix
        run: |
          node tools/landscape-patch.cjs .
          node --check assets/index-mobile-landscape-20261008.js
      - name: Save the ready-to-play release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/index-mobile-landscape-20261008.js
          if ! git diff --cached --quiet; then
            git commit -m "Require sideways phone orientation and pause portrait gameplay"
            git push
          fi
      - name: Publish the updated game
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"